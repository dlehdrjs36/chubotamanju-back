server:
  port: 8081

spring:
  application:
    name: chubotamanju-back
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:}"
    username: "${DB_ADMIN_ID:root}"
    password: "${DB_ADMIN_PASSWORD:dglee}"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

jwt:
  secret: "${JWT_SECRET}"
  access-expiration: 86400000 # 액세스 토큰 만료일 24시간
  refresh-expiration: 604800000 # 리프레시 토큰 만료일 7일
