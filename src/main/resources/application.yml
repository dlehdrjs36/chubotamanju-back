server:
  port: 8081

spring:
  application:
    name: daisso
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:}?sslMode=REQUIRED"
    username: "${DB_ADMIN_ID:root}"
    password: "${DB_ADMIN_PASSWORD:dglee}"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  messages:
    basename:
      - "messages/globalError"

