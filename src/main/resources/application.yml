server:
  port: 8081

jwt:
  secret: "${JWT_SECRET}"
  access-expiration: 86400000 # 액세스 토큰 만료일 24시간
  refresh-expiration: 604800000 # 리프레시 토큰“ 만료일 7일

spring:
  application:
    name: chubotamanju-back

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:}?sslMode=REQUIRED"
    username: "${DB_ADMIN_ID}"
    password: "${DB_ADMIN_PASSWORD}"

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  messages:
    basename:
      - "messages/globalError"

  security:
    oauth2:
      client:
        provider: # 공급자 설정
          discord:
            authorization-uri: "https://discord.com/oauth2/authorize"
            token-uri: "https://discord.com/api/oauth2/token"
            user-info-uri: "https://discord.com/api/users/@me"
            user-name-attribute: id
        registration: # 클라이언트 설정
          discord:
            authorization-grant-type: authorization_code
            client-id: "${DISCORD-CLIENT-ID}"
            client-secret: "${DISCORD-CLIENT-SECRET}"
            client-name: "${DISCORD-CLIENT-NAME}"
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: identify, email

# cloudflare r2 설정
cloudflare:
  r2:
    enabled: ${R2_ENABLED:false}
    account-id: ${R2_ACCOUNT_ID:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    worker-sign-secret: ${R2_WORKER_SIGN_SECRET:}
    signed-url-ttl-seconds: ${R2_SIGNED_URL_TTL_SECONDS:600}

