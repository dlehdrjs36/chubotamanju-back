
services:
  # 첫 번째 애플리케이션 (8081 포트로 서비스)
  chubotamanju-api-1:
    image: ghcr.io/dlehdrjs36/chubotamanju-back:latest
    container_name: chubotamanju-api-1
    ports:
      - "4720:8081" # 외부 8081 -> 컨테이너 내부 8080(Spring)
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      DB_ADMIN_ID: ${DB_ADMIN_ID}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_NAME: ${DISCORD_CLIENT_NAME}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENABLED: ${R2_ENABLED}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_SIGNED_URL_TTL_SECONDS: ${R2_SIGNED_URL_TTL_SECONDS}
      R2_WORKER_SIGN_SECRET: ${R2_WORKER_SIGN_SECRET}
      API_REQUEST_KEY: ${API_REQUEST_KEY}
      DISCORD_BOT_KEY: ${DISCORD_BOT_KEY}
#     SPRING_PROFILES_ACTIVE=prod

  # 두 번째 애플리케이션 (8082 포트로 서비스)
  chubotamanju-api-2:
    image: ghcr.io/dlehdrjs36/chubotamanju-back:latest
    container_name: chubotamanju-api-2
    ports:
      - "4721:8081" # 외부 8082 -> 컨테이너 내부 8080(Spring)
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      DB_ADMIN_ID: ${DB_ADMIN_ID}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_NAME: ${DISCORD_CLIENT_NAME}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENABLED: ${R2_ENABLED}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_SIGNED_URL_TTL_SECONDS: ${R2_SIGNED_URL_TTL_SECONDS}
      R2_WORKER_SIGN_SECRET: ${R2_WORKER_SIGN_SECRET}
      API_REQUEST_KEY: ${API_REQUEST_KEY}
      DISCORD_BOT_KEY: ${DISCORD_BOT_KEY}
#      - SPRING_PROFILES_ACTIVE=prod
