
services:
  # 첫 번째 애플리케이션 (8081 포트로 서비스)
  chubotamanju-api-1:
    image: ghcr.io/dlehdrjs36/chubotamanju-back:latest
    container_name: chubotamanju-api-1
    ports:
      - "4720:8081" # 외부 8081 -> 컨테이너 내부 8080(Spring)
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
#    environment:
#      - SPRING_PROFILES_ACTIVE=prod

  # 두 번째 애플리케이션 (8082 포트로 서비스)
  chubotamanju-api-2:
    image: ghcr.io/dlehdrjs36/chubotamanju-back:latest
    container_name: chubotamanju-api-2
    ports:
      - "4721:8081" # 외부 8082 -> 컨테이너 내부 8080(Spring)
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
#    environment:
#      - SPRING_PROFILES_ACTIVE=prod
